---
services:
  jwt-init-sequencer:
    container_name: jwt-init-sequencer
    image: alpine:3.22.0
    volumes:
      - jwttoken-sequencer:/jwt
    healthcheck:
      test: [CMD, test, -f, /jwt/jwt.hex]
      interval: 5s
      timeout: 5s
      retries: 3
    command: >
      /bin/sh -c "mkdir -p /jwt &&
      if [ ! -f /jwt/jwt.hex ]; then
        apk add --no-cache openssl &&
        openssl rand -hex 32 | tr -d '\n' > /jwt/jwt.hex;
      fi"

  passphrase-init-sequencer:
    container_name: passphrase-init-sequencer
    image: alpine:3.22.0
    volumes:
      - passphrase-sequencer:/passphrase
    healthcheck:
      test: [CMD, test, -f, /passphrase/passphrase]
      interval: 5s
      timeout: 5s
      retries: 3
    command: >
      /bin/sh -c "mkdir -p /passphrase &&
      if [ ! -f /passphrase/passphrase ]; then
        apk add --no-cache openssl &&
        openssl rand -base64 32 | tr -d '\n' > /passphrase/passphrase;
      fi"

  ev-reth-sequencer:
    container_name: ev-reth-sequencer
    image: ghcr.io/evstack/ev-reth:v0.1.0
    depends_on:
      jwt-init-sequencer:
        condition: service_completed_successfully
    env_file: .env
    ports:
      - $SEQUENCER_EV_RETH_PROMETHEUS_PORT:9001
      - "8545:8545"
    restart: always
    volumes:
      - ./genesis.json:/root/genesis.json:ro
      - jwttoken-sequencer:/root/jwt:ro
      - ev-reth-sequencer-data:/root/reth
    entrypoint: /bin/sh -c
    command:
      - |
          ev-reth node \
          --ev-reth.enable \
          --engine.persistence-threshold 0 \
          --engine.memory-block-buffer-target 0 \
          --engine.always-process-payload-attributes-on-canonical-head \
          --chain /root/genesis.json \
          --metrics 0.0.0.0:9001 \
          --log.file.directory /root/logs \
          --authrpc.addr 0.0.0.0 \
          --authrpc.port 8551 \
          --authrpc.jwtsecret /root/jwt/jwt.hex \
          --http --http.addr 0.0.0.0 --http.port 8545 \
          --http.api "admin,eth,net,web3,txpool" \
          --disable-discovery \
          --txpool.pending-max-count 200000 \
          --txpool.pending-max-size 200 \
          --txpool.queued-max-count 200000 \
          --txpool.queued-max-size 200 \
          --txpool.max-account-slots 2048 \
          --txpool.max-new-txns 2048 \
          --txpool.additional-validation-tasks 16 \
          --datadir /root/reth
    networks:
      - evstack_shared

  single-sequencer:
    container_name: single-sequencer
    image: ghcr.io/evstack/ev-node-evm-single:v1.0.0-beta.10
    env_file: .env
    ports:
      - $SEQUENCER_EV_NODE_PROMETHEUS_PORT:26660
      - "7331:7331" # Esto expondría el puerto 7331 del contenedor al 7331 del host
    restart: always
    depends_on:
      ev-reth-sequencer:
        condition: service_started
      passphrase-init-sequencer:
        condition: service_completed_successfully
    volumes:
      - sequencer-data:/root/.evm-single
      - jwttoken-sequencer:/root/jwt:ro
      - passphrase-sequencer:/root/passphrase:ro
      - sequencer-export:/volumes/sequencer_export
      - ./entrypoint.sequencer.sh:/usr/bin/entrypoint.sh
      - ../../lib/logging.sh:/usr/local/lib/logging.sh:ro
    entrypoint: ["/usr/bin/entrypoint.sh"]
    environment:
      - EVM_ENGINE_URL=http://ev-reth-sequencer:8551
      - EVM_ETH_URL=http://ev-reth-sequencer:8545
      - EVM_JWT_SECRET_FILE=/root/jwt/jwt.hex
      - EVM_BLOCK_TIME=500ms
      - EVM_SIGNER_PASSPHRASE_FILE=/root/passphrase/passphrase
      - DA_BLOCK_TIME=30s
      - DA_ADDRESS=http://celestia-node:26658
      - DA_HEADER_NAMESPACE=${SEQUENCER_DA_HEADER_NAMESPACE}
      - DA_DATA_NAMESPACE=${SEQUENCER_DA_DATA_NAMESPACE}
      # DA tuning
      - DA_GAS_PRICE=0.005
      - DA_GAS_MULTIPLIER=1
      - DA_MAX_SUBMIT_ATTEMPTS=10
      # Verbose logging
      - EVNODE_LOG_LEVEL=debug
      - EVNODE_LOG_TRACE=true
    networks:
      - evstack_shared

  contract-deployer:
    container_name: contract-deployer
    image: ghcr.io/foundry-rs/foundry:latest
    depends_on:
      single-sequencer:
        condition: service_started
    volumes:
      - ../../contracts:/contracts:ro
      - ../../scripts/auto_deploy_contracts.sh:/usr/local/bin/auto_deploy_contracts.sh:ro
      - ../../frontend:/volumes/contracts
    environment:
      - RPC_URL=http://ev-reth-sequencer:8545
      - CHAIN_ID=${CHAIN_ID}
      - DEPLOYER_PRIVATE_KEY=${DEPLOYER_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        apk add --no-cache bash curl jq
        bash /usr/local/bin/auto_deploy_contracts.sh
    networks:
      - evstack_shared
    restart: "no"

volumes:
  jwttoken-sequencer:
    driver: local
  passphrase-sequencer:
    driver: local
  ev-reth-sequencer-data:
    driver: local
  sequencer-data:
    driver: local
  sequencer-export:
    name: sequencer-export
    driver: local

networks:
  evstack_shared:
    external: true
