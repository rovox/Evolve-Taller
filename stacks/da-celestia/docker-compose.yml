services:
  da:
    container_name: celestia-node
    image: ghcr.io/celestiaorg/celestia-node:v0.28.4-mocha
    env_file: .env
    restart: always
    volumes:
      - celestia-node-data:/home/celestia
      - ./entrypoint.da.sh:/entrypoint.sh
      - ../../lib/logging.sh:/usr/local/lib/logging.sh:ro
    environment:
      - VOLUME_EXPORT_PATH=/volumes/da_export
    entrypoint: [/bin/bash, /entrypoint.sh]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    ports:
      - $DA_RPC_PORT:26658
      - 2121:2121/tcp
      - 2121:2121/udp
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
      - 8.8.4.4
    dns_search: .
    dns_opt:
      - use-vc
      - no-tld-query
    healthcheck:
      # Verify node has synchronized headers (more reliable than p2p.Info for determining actual readiness)
      test: ["CMD-SHELL", "curl -s -X POST -H 'Content-Type: application/json' --data '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"header.LocalHead\"}' http://localhost:26658 | grep -q 'result' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    networks:
      - evstack_shared

volumes:
  celestia-node-data:
    driver: local

networks:
  evstack_shared:
    name: evstack_shared
    external: true
