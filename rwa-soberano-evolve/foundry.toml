[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"

# Habilitar optimizador para reducir tamaño de contratos
optimizer = true
optimizer_runs = 1000  # Aumentado para optimizar más el tamaño
# Para contratos muy grandes, usa via-ir
via_ir = true

# Remappings para OpenZeppelin
remappings = [
    '@openzeppelin/=lib/openzeppelin-contracts/',
    '@forge-std/=lib/forge-std/src/'
]
ignored_error_codes = []
# Avoid compiling OpenZeppelin's own tests and harnesses
ignored_paths = [
    "lib/openzeppelin-contracts/test",
    "lib/openzeppelin-contracts/certora",
    "lib/openzeppelin-contracts/scripts",
    "lib/openzeppelin-contracts/hardhat",
    "lib/openzeppelin-contracts/docs",
    "lib/openzeppelin-contracts/audits",
    "lib/openzeppelin-contracts/.github",
]

[profile.size-optimized]
optimizer = true
optimizer_runs = 1
via_ir = false

[profile.production]
optimizer = true
optimizer_runs = 200
via_ir = false

[lint]
# Habilitar todas las reglas de linting por defecto
enable = true
# Forzar importaciones nombradas
unaliased_plain_import = "error"
# Forzar mixedCase para variables y funciones
mixed_case = "error"


fs_permissions = [
    { access = "read", path = "." },
    { access = "write", path = "." },
    { access = "write", path = "./deployed-addresses.env" }
]

# Configuracion para Celestia Mocha y Rollup local
[rpc_endpoints]
reth = "http://localhost:8545"  # puerto de reth
localhost = "http://localhost:8545"
# celestia = "https://rpc-mocha.pops.one/"
# Alternativas si falla:
# celestia = "https://celestia-mocha-rpc.publicnode.com:443"
# celestia = "https://mocha-rpc.celenium.io/"

[etherscan]
celestia = { key = "" }

# Para gas optimization
[fuzz]
runs = 10000

[fmt]
line_length = 120


# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
