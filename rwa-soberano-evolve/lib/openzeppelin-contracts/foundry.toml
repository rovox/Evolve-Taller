[profile.default]
solc_version = '0.8.27'
evm_version = 'prague'
optimizer = true
optimizer-runs = 200
src = 'contracts'
out = 'out'
libs = ['node_modules', 'lib']
test = 'zz_ignore_tests'
cache_path  = 'cache_forge'
fs_permissions = [{ access = "read", path = "./test/bin" }]

# Prevent consumers from compiling OZ tests and certora harnesses
ignored_paths = [
	'test',
	'certora',
	'scripts',
	'hardhat',
	'docs',
	'audits',
	'.github'
]

[fuzz]
runs = 5000
max_test_rejects = 150000
